<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Netflix Explorer</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <a class="skip" href="#titles-heading">Skip to titles</a>
    <header class="site-header">
      <h1>Netflix Explorer</h1>
      <dl id="stats" class="stats" aria-label="Catalog statistics" aria-busy="true"></dl>
    </header>
    <main>
      <form id="search" class="search" role="search" aria-label="Search titles">
        <div class="field">
          <label for="q">Title contains</label>
          <input id="q" name="q" type="search" autocomplete="off" />
        </div>
        <div class="field">
          <label for="kind">Kind</label>
          <select id="kind" name="kind">
            <option value="">Movies and shows</option>
            <option value="movie">Movies</option>
            <option value="show">Shows</option>
          </select>
        </div>
        <div class="field">
          <label for="year">Release year</label>
          <input id="year" name="year" type="number" inputmode="numeric" min="1900" max="2100" step="1" />
        </div>
        <div class="field">
          <label for="sort">Sort by</label>
          <select id="sort" name="sort">
            <option value="title">Title</option>
            <option value="hours">Hours viewed (most first)</option>
          </select>
        </div>
        <button type="submit">Search</button>
      </form>
      <p id="year-note" class="note" hidden>Titles whose release year is unknown are hidden while a year is set. Most titles have no release year.</p>
      <div class="layout">
        <section aria-labelledby="titles-heading">
          <h2 id="titles-heading" tabindex="-1">Titles</h2>
          <p id="status" role="status" aria-live="polite"></p>
          <ul id="titles" class="grid"></ul>
          <nav class="pager" aria-label="Pagination">
            <button type="button" id="prev">Previous</button>
            <span id="page-info"></span>
            <button type="button" id="next">Next</button>
          </nav>
        </section>
        <section id="detail" class="detail" aria-labelledby="detail-heading" hidden>
          <h2 id="detail-heading" tabindex="-1">Details</h2>
          <p id="detail-status" role="status" aria-live="polite"></p>
          <div id="detail-body"></div>
          <section id="reviews" class="reviews" aria-labelledby="reviews-heading" hidden>
            <h3 id="reviews-heading">Reviews</h3>
            <div class="field">
              <label for="user-select">Acting as</label>
              <select id="user-select"></select>
            </div>
            <p id="review-status" class="review-status" role="status" aria-live="polite"></p>
            <ul id="review-list" class="review-list"></ul>
            <form id="review-form" class="review-form" novalidate aria-labelledby="review-form-heading">
              <h4 id="review-form-heading">Write a review</h4>
              <div class="field">
                <label for="review-rating">Rating (1 to 5)</label>
                <input id="review-rating" type="number" inputmode="numeric" step="1" />
              </div>
              <div class="field">
                <label for="review-body">Your review</label>
                <textarea id="review-body" rows="4"></textarea>
                <span id="review-count" class="count">0 / 2000</span>
              </div>
              <div class="actions">
                <button type="submit" id="review-submit">Post review</button>
                <button type="button" id="review-cancel" hidden>Cancel edit</button>
              </div>
            </form>
          </section>
        </section>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
