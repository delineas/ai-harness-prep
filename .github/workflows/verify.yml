# Everything that is checked locally, checked again where nobody can skip it.
# Make these jobs REQUIRED in the branch ruleset (docs/server-checks.md), or they only advise.
name: verify

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Same rule as .githooks (pre-commit, pre-push): one source of truth, .githooks/branch-policy.sh.
  branch-name:
    name: branch-name
    if: github.event_name == 'pull_request' || github.ref_name != 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REF: ${{ github.head_ref || github.ref_name }}   # via env, never inlined in a script: names can hold shell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          . .githooks/branch-policy.sh
          branch_ok "$REF" || branch_reject "$REF"

  # typecheck + unit tests (incl. tests/architecture.test.ts) + build + browser e2e.
  verify:
    name: verify
    if: github.event_name == 'pull_request' || github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fetch-catalog   # downloads data/catalog.db and checks its SHA-256
      - run: npx playwright install --with-deps chromium
      - run: npm run verify

  # The bwrap launcher that masks data/app.db and strips BATCH_*. Needs user namespaces.
  # Any non-zero exit fails, including 2 ("cannot run here"): on the server, unverified is red.
  agent-run:
    name: agent-run
    if: github.event_name == 'pull_request' || github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run check:agent-run
